<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STAR Prep">
<meta name="theme-color" content="#F6F3EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>STAR Prep</title>
<style>
/* Layout: header and tab bar stay put; only <main> scrolls. iPhone standalone PWAs otherwise let the whole page
   rubber-band, which drags a position:fixed tab bar along. Keep this in every app built on this core. */
:root{--bg:#F6F3EC;--surface:#FFFFFF;--surface2:#EEE9DE;--ink:#1F1B15;--muted:#6E675B;--line:#E3DDD0;--ok:#2B8A5E;--warn:#B57A00;--danger:#C2392F;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;--ok:#4DBB89;--warn:#F2B83A;--danger:#F0685C;--on:#13110D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;--ok:#4DBB89;--warn:#F2B83A;--danger:#F0685C;--on:#13110D;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header.top{position:relative;flex:none;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;text-align:left}.who h1{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.who p{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.alert::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
main{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:4px max(16px,calc((100% - 528px)/2)) 28px}
nav.tabs{position:relative;flex:none;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
.tab svg{width:24px;height:24px}.tab.on{color:var(--ink);font-weight:600}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.tab.add{color:var(--on)}.tab.add span.plus{width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.tab.add span.plus svg{width:26px;height:26px}.tab.add em{font-style:normal;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.card h3 .r{margin-left:auto;font-weight:600;font-size:14px;color:var(--muted)}
.card h3 svg{width:18px;height:18px;color:var(--acc)}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--ink);color:var(--bg)}.chip.a{background:color-mix(in srgb,var(--acc) 14%,var(--surface));color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll .chip{flex:none;max-width:none}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.btn{flex:1;padding:13px 10px;border-radius:14px;background:var(--surface2);font-weight:600;text-align:center;font-size:16px}
.btn.primary{background:var(--acc);color:var(--on)}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{flex:none;padding:9px 14px;font-size:15px}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.row-btns{display:flex;gap:8px}
.link{display:block;margin:10px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:15px;line-height:1.5}
.nudge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}.nudge span{flex:1}
.nudge.err{border-color:var(--danger);color:var(--danger)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet.on{transform:none}.sheet.full{height:94vh;height:94dvh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px 16px 8px;flex:none}.sh-head h2{flex:1;font-size:19px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .icon-btn{width:36px;height:36px}.sh-head .icon-btn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));flex:1}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.search{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.search .in{flex:1;position:relative}.search input{width:100%;padding:11px 12px 11px 38px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.search .in svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 6px;display:flex;align-items:center;gap:8px}
.sec .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none;min-height:44px}
.fld textarea{min-height:84px;resize:vertical;line-height:1.4}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tog span{flex:1}.tog small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on::after{transform:translateX(20px)}
.set-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px}
.list{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.list li+li{border-top:1px solid var(--line)}.list .it{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left;min-height:52px}
.list .nm{flex:1;min-width:0}.list .nm b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}.list .nm small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.list .end{text-align:right;flex:none;font-size:13px;color:var(--muted)}.list .end b{display:block;font-size:15px;color:var(--ink)}
.stack{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}.chart text{font-size:10px;fill:var(--muted)}.chart .gl{stroke:var(--line);stroke-width:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:20px}.stat small{color:var(--muted);font-size:12px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:var(--acc);font-weight:700;text-decoration:underline}
.hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px;line-height:1.45}
.warn{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.5}.calc b{color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.days{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface2);color:var(--muted)}
.days.red{background:color-mix(in srgb,var(--danger) 15%,var(--surface));color:var(--danger)}.days.amb{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.days.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc))}

:root{--acc:#5149C2;--gold:#D99A0B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#9C95F2;--gold:#F2B83A}}
:root[data-theme="dark"]{--acc:#9C95F2;--gold:#F2B83A}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
.list .end small{display:block;margin-top:3px}
.hero2{display:flex;align-items:center;gap:14px}.hero2 .big{font-size:44px;font-weight:700;color:var(--acc);min-width:52px;text-align:center}.hero2 b{display:block;font-size:17px}.hero2 small{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tile svg{width:24px;height:24px;color:var(--acc);margin-bottom:4px}.tile b{font-size:15.5px}.tile small{color:var(--muted);font-size:13px;line-height:1.35}
.ivcard{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.st-title{font-size:22px;line-height:1.25}
.hook{background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-radius:14px;padding:10px 14px;font-weight:600;margin-bottom:12px;font-size:15.5px}
.beat{display:flex;gap:12px;margin-bottom:12px}.beat>span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;flex:none;color:#fff;background:var(--acc);font-size:15px}
.beat.b-s>span{background:#5E7FB8}.beat.b-t>span{background:#8B6BC8}.beat.b-a>span{background:var(--acc)}.beat.b-r>span{background:#2B8A5E}
.beat b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.beat p{white-space:pre-wrap;font-size:15.5px;line-height:1.45;margin-top:2px}
.metric{border:1.5px dashed color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:12px;padding:8px 12px;font-weight:600;font-size:14.5px;margin-bottom:12px}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.45;margin-bottom:10px}.notes.big{font-size:16px}
.qcard{background:var(--ink);color:var(--bg);border-radius:20px;padding:16px 18px}.qcard small{opacity:.7;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.qcard p{font-size:20px;font-weight:600;line-height:1.3;margin:6px 0 10px}.qcard .chip{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grades .btn{padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}.grades small{font-size:11.5px;font-weight:500;opacity:.8}
.grades .g0{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}.grades .g1{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.grades .g2{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}.grades .g3{background:color-mix(in srgb,var(--acc) 15%,var(--surface));color:var(--acc)}
.timer{display:flex;justify-content:center;margin:10px 0 6px}.tring{width:220px;height:220px}
.tring .trk{fill:none;stroke:var(--surface2);stroke-width:14}.tring .val{fill:none;stroke:var(--acc);stroke-width:14;stroke-linecap:round}.tring .val.over{stroke:var(--danger)}
.tring .big{fill:var(--ink);font-size:46px;font-weight:700;text-anchor:middle;font-variant-numeric:tabular-nums}.tring .big.over{fill:var(--danger)}.tring .sm{fill:var(--muted);font-size:15px;text-anchor:middle;font-weight:600}
.phases{display:flex;gap:4px}.phases div{display:flex;flex-direction:column;gap:4px}.phases i{display:block;height:6px;border-radius:3px;background:var(--acc);width:0}
.phases div{position:relative}.phases div::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:3px;background:var(--surface2);z-index:-1}
.phases span{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}.phases .on span{color:var(--acc)}
.phases{isolation:isolate}
.oc.offer,.oc.next{color:var(--ok)}.oc.no{color:var(--danger)}
.cnt{min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.cnt.z{background:color-mix(in srgb,var(--danger) 13%,var(--surface));color:var(--danger)}.cnt.o{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:color-mix(in srgb,var(--gold) 75%,var(--ink))}
details.more summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin:10px 2px}
.red{color:var(--danger)}

</style>
</head>
<body>
<header class="top">
  <button class="who" data-act="noop" aria-label="STAR Prep"><h1 id="hName">STAR Prep</h1><p id="hSub"></p></button>
  <button class="icon-btn" id="gearBtn" data-act="settings" aria-label="Settings"></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ===== Shared core (Yupu/Thali family): storage, sheets, settings, backup and GitHub sync =====
   Each app defines APP before this block:
   APP={id,name,version,date,dir,colls:{name:{shard?:rec=>string}},settings:{},tabs:[[key,label,icon]],
        main(tab),mount?(tab),headerTitle?(),headerSub?(),tabBadge?(key),appBadge?(),settingsTop?(),about,
        addAction?, onMerged?(), init?(), syncNote?} */
'use strict';
const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  gear:ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),left:ic('<path d="M15 18l-6-6 6-6"/>'),right:ic('<path d="M9 18l6-6-6-6"/>'),
  down:ic('<path d="M6 9l6 6 6-6"/>'),x:ic('<path d="M18 6 6 18M6 6l12 12"/>'),check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  search:ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),edit:ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),

function mergeList(target,incoming,onChange){

    if(i==null){target.push(r);idx.set(r.id,target.length-1);n++;onChange&&onChange(null,r);}
    else if((r.updatedAt||0)>(target[i].updatedAt||0)){const old=target[i];target[i]=r;n++;onChange&&onChange(old,r);}}

/* ---------- automatic sync via a private GitHub repository ----------
   <dir>/<collection>[-<shard>].json — records merged by id + updatedAt; deletions travel as flags.
   Push rewrites only files changed on this phone, using the file's version (sha) as a lock. */
let syncing=false,syncTimer=null,syncAgain=false;
function markDirty(...keys){if(!S.sync)return;S.sync.dirty=S.sync.dirty||{};keys.forEach(k=>{if(k)S.sync.dirty[k]=1;});scheduleSync();}
function scheduleSync(ms=15000){if(!S.sync||!S.sync.on)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>autoSync(),ms);}
function normRepo(v){return String(v||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,'');}
async function gh(path,{method='GET',body,accept,repo,token}={}){
  const s=S.sync;
  return fetch('https://api.github.com/repos/'+(repo||s.repo)+path,{method,cache:'no-store',body,
    headers:{'Authorization':'Bearer '+(token||s.token),'Accept':accept||'application/vnd.github+json',...(body?{'Content-Type':'application/json'}:{})}});
}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function syncErrText(st){
  if(st===401)return 'GitHub rejected the token. It may have expired: turn sync off and on with a new token.';
  if(st===403)return 'The token is missing write access (Contents: Read and write), or GitHub is limiting requests.';
  if(st===404)return 'Repository not found, or this token has no access to it.';
  if(st==='conflict')return 'Both phones were syncing at once. Will retry shortly.';
  if(st==='net')return 'Could not reach GitHub. Will retry when online.';
  return 'GitHub error '+st+'. Will retry.';
}
function agoText(ts){const m=Math.round((Date.now()-ts)/6e4);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} days ago`;}
function syncStatus(){const s=S.sync;if(!s.on)return 'Off';if(syncing)return 'Syncing…';if(s.err)return s.err;if(!navigator.onLine)return 'Offline. Will sync when online.';return s.last?`Synced ${agoText(s.last)}`:'Waiting for first sync';}
function setSyncUI(){const el=$('#syncStatus');if(el){el.textContent=syncStatus();el.closest('.nudge')?.classList.toggle('err',!!S.sync.err);}$('#gearBtn').classList.toggle('alert',!!(S.sync.on&&S.sync.err));}
function collOfKey(k){return COLLS.find(c=>k===c||k.startsWith(c+'-'));}
function fileFor(k){const c=collOfKey(k);return JSON.stringify({app:APP.id,kind:'coll',coll:c,key:k,records:S[c].filter(r=>fileKey(c,r)===k)});}
function mergeRemote(obj){
  if(!obj||obj.app!==APP.id||obj.kind!=='coll'||!APP.colls[obj.coll])return false;
  const c=obj.coll;return mergeList(S[c],obj.records,(o,r)=>{if(o&&fileKey(c,o)!==fileKey(c,r))S.sync.dirty[fileKey(c,o)]=1;})>0;

async function autoSync(){
  const s=S.sync;if(!s.on||!s.repo||!s.token)return;
  if(syncing){syncAgain=true;return;}
  if(!navigator.onLine){setSyncUI();return;}
  syncing=true;setSyncUI();let changed=false;
  try{
    for(let attempt=0;;attempt++){
      const lr=await gh('/contents/'+APP.dir);let list=[];
      if(lr.status===404){const rr=await gh('');if(!rr.ok)throw rr.status;}
      else if(!lr.ok)throw lr.status;
      else list=(await lr.json()).filter(f=>f.type==='file'&&/\.json$/.test(f.name));
      const remote={};list.forEach(f=>remote[f.name]=f.sha);
      for(const f of list){
        if(s.shas[f.name]===f.sha)continue;
        const fr=await gh('/contents/'+APP.dir+'/'+encodeURIComponent(f.name),{accept:'application/vnd.github.raw+json'});
        if(!fr.ok)throw fr.status;
        try{if(mergeRemote(JSON.parse(await fr.text())))changed=true;}catch(e){}
        s.shas[f.name]=f.sha;
      }
      if(changed&&APP.onMerged)APP.onMerged();
      save();
      let clash=false;
      for(const k of Object.keys(s.dirty||{})){
        const name=k+'.json',c=collOfKey(k);
        if(!c||(!remote[name]&&!S[c].some(r=>fileKey(c,r)===k))){delete s.dirty[k];continue;}
        const pr=await gh('/contents/'+APP.dir+'/'+encodeURIComponent(name),{method:'PUT',body:JSON.stringify({message:`${S.settings.device||APP.name}: ${k}`,content:b64enc(fileFor(k)),...(remote[name]?{sha:remote[name]}:{})})});
        if(pr.status===409||pr.status===422){clash=true;break;}
        if(!pr.ok)throw pr.status;
        const j=await pr.json();s.shas[name]=remote[name]=j.content.sha;delete s.dirty[k];save();
      }
      if(!clash)break;
      if(attempt>=3)throw 'conflict';
      await new Promise(r=>setTimeout(r,800+Math.random()*1200));
    }
    if(APP.afterSync)await APP.afterSync();
    s.last=Date.now();s.err='';
  }catch(e){s.err=syncErrText(e instanceof TypeError?'net':e);}
  finally{
    syncing=false;save();
    if(changed&&!sheetOpen()&&!(document.activeElement&&document.activeElement.matches('#main input,#main textarea')))render();else if(changed){renderHeader();renderTabs();}
    setSyncUI();
    if(syncAgain){syncAgain=false;scheduleSync(2000);}
  }
}
async function syncTurnOn(){
  const repo=normRepo($('#s-repo').value),token=$('#s-token').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Enter the repository as username/repository-name.');
  if(!token)return toast('Paste the access token.');
  toast('Checking connection…');

  if(r.status===401)return toast('GitHub rejected this token. Check it was copied completely.');
  if(!r.ok)return toast('Repository not found, or the token has no access to it.');
  const info=await r.json();
  if(!info.private)return toast('That repository is public. Use a private one.');
  Object.assign(S.sync,{repo,token,on:true,err:'',shas:{},dirty:{}});
  for(const c of COLLS)for(const r of S[c])S.sync.dirty[fileKey(c,r)]=1;
  save();refreshView();toast('Sync is on. First sync running…');autoSync();
}

/* ---------- calendar (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);}
function icsFold(l){const out=[];while(l.length>74){out.push(l.slice(0,74));l=' '+l.slice(74);}out.push(l);return out.join('\r\n');}
const icsDate=k=>k.replace(/-/g,'');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
// events: [{uid,day,end?,title,desc,alarms:[daysBefore...],start?:min,dur?:min}]
function icsBuild(events,calName){
  const L=['BEGIN:VCALENDAR','VERSION:2.0',`PRODID:-//${APP.name}//EN`,'CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${icsEsc(calName||APP.name)}`];
  for(const e of events){
    L.push('BEGIN:VEVENT',`UID:${e.uid}@${APP.id}`,`DTSTAMP:${icsStamp()}`);
    if(e.start!=null){const t=x=>icsDate(e.day)+'T'+pad(Math.floor(x/60))+pad(x%60)+'00';L.push(`DTSTART:${t(e.start)}`,`DTEND:${t(e.start+(e.dur||60))}`);}
    else L.push(`DTSTART;VALUE=DATE:${icsDate(e.day)}`,`DTEND;VALUE=DATE:${icsDate(addDay(e.end||e.day,1))}`);
    L.push(icsFold('SUMMARY:'+icsEsc(e.title)));if(e.desc)L.push(icsFold('DESCRIPTION:'+icsEsc(e.desc)));
    // timed events: alarm d minutes before; all-day events: alarm at 09:00, d days before
    for(const d of (e.alarms||[]))L.push('BEGIN:VALARM','ACTION:DISPLAY',icsFold('DESCRIPTION:'+icsEsc(e.title)),
      e.start!=null?`TRIGGER:-PT${d}M`:d<=0?'TRIGGER:PT9H':`TRIGGER:-P${d-1}DT15H`,'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function schedule(st,grade){ // grade: 0 again, 1 hard, 2 good, 3 easy → returns {ivl,ease,reps,lapses}
  const s={ivl:0,ease:2.5,reps:0,lapses:0,...(st.sr||{})};
  if(grade===0){s.reps=0;s.ivl=1;s.ease=Math.max(1.3,s.ease-0.2);s.lapses++;}
  else if(grade===1){s.ivl=Math.max(1,Math.round((s.ivl||1)*1.2));s.ease=Math.max(1.3,s.ease-0.15);s.reps++;}
  else if(grade===2){s.ivl=s.reps===0?1:s.reps===1?3:Math.round(s.ivl*s.ease);s.reps++;}
  else{s.ivl=s.reps===0?3:Math.round(Math.max(1,s.ivl)*s.ease*1.3);s.ease+=0.15;s.reps++;}
  const iv=nextIv();if(iv){const before=diffDays(iv.day,today())-1;if(before>=1)s.ivl=Math.min(s.ivl,before);}
  s.ivl=Math.max(1,Math.min(s.ivl,120));s.due=addDay(today(),s.ivl);return s;
}

let TM=null;
function timerView(storyId,question){
  const st=storyId?getRec('stories',storyId):null;

  return {full:true,onClose:stopTimer,html:()=>{
    const t=TM;const notes=!S.settings.hideNotes&&t.st;
    return `${head(t.st?t.st.title:'Rehearse',{back:STACK.length>1})}<div class="sh-body">
      ${t.question?`<div class="qcard"><small>Question</small><p>${esc(t.question)}</p></div>`:''}
      <div class="timer"><svg viewBox="0 0 220 220" class="tring"><circle cx="110" cy="110" r="96" class="trk"/><circle id="tarc" cx="110" cy="110" r="96" class="val" stroke-dasharray="0 604" transform="rotate(-90 110 110)"/>

      <div class="phases">${[['Situation & Task','20%'],['Action','55%'],['Result','25%']].map(([l,w],i)=>`<div id="ph${i}" style="flex:${parseInt(w)}"><i></i><span>${l}</span></div>`).join('')}</div>
      <div class="chips" style="justify-content:center;margin:12px 0">${[60,90,120,150,180].map(s=>`<button class="chip ${t.total===s?'on':''}" data-act="tm-len" data-v="${s}">${mmss(s)}</button>`).join('')}</div>
      <div class="row-btns" style="margin-bottom:12px"><button class="btn" data-act="tm-reset">${I.reset}Reset</button><button class="btn primary" id="tmgo" data-act="tm-go">${I.play}Start</button></div>
      ${tog('tm-rec',t.recOn,'Record my answer','Stays on this phone until you close the timer; play it back to hear yourself')}
      <div id="tmaudio"></div>
      ${t.st?`${tog('tm-notes',!S.settings.hideNotes,'Show my notes','Turn off for a realistic run')}${notes?`<div style="margin-top:10px">${starBlocks(t.st)}</div>`:''}`:''}
    </div>`;},mount:tmPaint};
}
function tmElapsed(){return TM.acc+(TM.run?(Date.now()-TM.t0)/1000:0);}
function tmPaint(){
  if(!TM||!$('#tnum'))return;const e=tmElapsed(),left=TM.total-e,frac=Math.min(1,e/TM.total);
  $('#tnum').textContent=(left<0?'+':'')+mmss(Math.abs(left));$('#tnum').classList.toggle('over',left<0);
  $('#tarc').setAttribute('stroke-dasharray',`${frac*603.2} 604`);$('#tarc').classList.toggle('over',left<0);
  const ph=frac<0.2?0:frac<0.75?1:2;const lab=['Situation & Task','Action','Result'][ph];
  $('#tph').textContent=!TM.run&&e===0?'Ready':left<0?'Wrap up':lab;
  [0,1,2].forEach(i=>{const el=$('#ph'+i);if(!el)return;const lo=[0,0.2,0.75][i],hi=[0.2,0.75,1][i];el.querySelector('i').style.width=Math.max(0,Math.min(1,(frac-lo)/(hi-lo)))*100+'%';el.classList.toggle('on',ph===i&&e>0);});
  if(TM.run&&ph!==TM.phase){if(TM.phase>=0)vib(40);TM.phase=ph;}
  if(TM.run&&left<=0&&!TM.buzzed){TM.buzzed=true;vib([80,60,80]);}
}
async function tmGo(){
  const t=TM;
  if(t.run){t.acc=tmElapsed();t.run=false;clearInterval(t.h);if(t.rec&&t.rec.state==='recording')t.rec.stop();$('#tmgo').innerHTML=I.play+'Resume';tmPaint();return;}
  if(t.recOn&&!t.rec){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});t.stream=s;t.chunks=[];t.rec=new MediaRecorder(s);
      t.rec.ondataavailable=e=>{if(e.data&&e.data.size)t.chunks.push(e.data);};t.rec.onstop=tmShowAudio;t.rec.start();}
    catch(e){toast('Microphone not available. Timing without recording.');t.recOn=false;}}
  else if(t.rec&&t.rec.state==='inactive'){/* resumed after pause: keep the earlier take, start a new one */t.chunks=[];try{t.rec.start();}catch(e){}}
  t.t0=Date.now();t.run=true;t.h=setInterval(tmPaint,200);$('#tmgo').innerHTML=I.pause+'Pause';tmPaint();
}
function tmShowAudio(){
  const t=TM;if(!t||!t.chunks.length)return;const blob=new Blob(t.chunks,{type:t.rec.mimeType||'audio/mp4'});
  if(t.audio)URL.revokeObjectURL(t.audio);t.audio=URL.createObjectURL(blob);t.blob=blob;
  const box=$('#tmaudio');if(box)box.innerHTML=`<div class="card" style="margin-top:10px"><h3>${I.mic}Your answer<span class="r">${mmss(tmElapsed())}</span></h3><audio controls src="${t.audio}" style="width:100%;margin-top:8px"></audio><button class="btn small" data-act="tm-save" style="margin-top:8px">${I.share}Save to Files</button></div>`;
}
function stopTimer(){
  if(!TM)return;clearInterval(TM.h);try{if(TM.rec&&TM.rec.state==='recording')TM.rec.stop();}catch(e){}
  if(TM.stream)TM.stream.getTracks().forEach(x=>x.stop());if(TM.audio)setTimeout(()=>URL.revokeObjectURL(TM&&TM.audio||''),1000);
  if(TM.st&&tmElapsed()>20){const st=getRec('stories',TM.st.id);if(st){st.rehearsed=(st.rehearsed||0)+1;st.lastRehearsal={d:today(),secs:Math.round(tmElapsed())};putRec('stories',st);}}
  TM=null;
}

function gapsHtml(){
  const seg=VIEW.gseg||'comp';
  let h=`<div class="seg">${[['comp','Competencies'],['q','Questions'],['own','My questions']].map(([k,l])=>`<button class="${seg===k?'on':''}" data-act="gseg" data-v="${k}">${l}</button>`).join('')}</div>`;
  const by=new Map(COMPS.map(([k])=>[k,[]]));stories().forEach(s=>(s.comps||[]).forEach(c=>by.has(c)&&by.get(c).push(s)));
  if(seg==='comp'){
    const missing=COMPS.filter(([k])=>!by.get(k).length).length;
    h+=`<div class="stat"><div><span>Covered</span><b>${COMPS.length-missing}</b><small>of ${COMPS.length}</small></div><div><span>Stories</span><b>${stories().length}</b><small>${stories().filter(s=>s.lang==='de'||s.lang==='both'||s.de).length} with German</small></div></div>`;
    h+=`<ul class="list">${COMPS.map(([k,l])=>{const ss=by.get(k);const avg=ss.length?ss.reduce((a,s)=>a+strength(s),0)/ss.length:0;
      return `<li><button class="it" data-act="gap-comp" data-v="${k}"><span class="nm"><b>${esc(l)}</b><small>${ss.length?ss.map(s=>esc(s.title)).join(', '):'No story yet'}</small></span><span class="cnt ${ss.length===0?'z':ss.length===1?'o':''}">${ss.length}</span></button></li>`;}).join('')}</ul>
      <p class="muted small" style="margin:6px 2px">Aim for two stories per competency, so you never tell the same one twice to one company.</p>`;
  }else if(seg==='q'){
    const L=S.settings.lang==='de'?'de':'en';
    const qs=allQuestions().map(q=>({q,n:stories().filter(s=>(s.comps||[]).some(c=>q.comps.includes(c))).length}));
    const open=qs.filter(x=>!x.n),thin=qs.filter(x=>x.n===1);
    h+=`<p class="muted" style="margin:0 2px 8px">${open.length?`${plural(open.length,'question')} you have no story for yet`:'Every question has at least one story.'}${thin.length?`, ${thin.length} with only one.`:'.'}</p>`;
    if(open.length)h+=`<div class="sec">No story yet</div><ul class="list">${open.map(x=>`<li><button class="it" data-act="drill-q" data-id="${x.q.id}"><span class="nm"><b>${esc(qText(x.q,L))}</b><small>${x.q.comps.map(c=>esc(COMP[c]||c)).join(' · ')||'Not tagged'}</small></span></button></li>`).join('')}</ul>`;
    if(thin.length)h+=`<div class="sec">Only one story</div><ul class="list">${thin.map(x=>`<li><button class="it" data-act="drill-q" data-id="${x.q.id}"><span class="nm"><b>${esc(qText(x.q,L))}</b></span></button></li>`).join('')}</ul>`;
  }else{
    const own=live('questions');
    h+=`<div class="search"><div class="in">${I.plus}<input id="oq" placeholder="Add a question you were asked" autocomplete="off" enterkeyhint="done"></div></div>`;
    h+=own.length?`<ul class="list">${own.map(q=>`<li><button class="it" data-act="edit-q" data-id="${q.id}"><span class="nm"><b>${esc(q.text)}</b><small>${(q.comps||[]).length?q.comps.map(c=>esc(COMP[c]||c)).join(' · '):'<span class="red">Tag it so drills can match stories</span>'}${q.src?' · '+esc(q.src):''}</small></span></button></li>`).join('')}</ul>`
      :`<div class="empty">Questions you add here, or from an interview log, join the drill alongside the ${QB.length} built-in ones.</div>`;
  }
  return h;
}
function qEditView(id){const q=getRec('questions',id);let comps=[...(q.comps||[])],lang=q.lang||'en';
  return {html:()=>`${head('Question',{back:STACK.length>1})}<div class="sh-body"><label class="fld"><span>Question</span><textarea id="qe-t">${esc(q.text)}</textarea></label>
    ${chipRow('qe-lang',[['en','English'],['de','Deutsch']],lang)}<div class="sec">Competencies</div><div class="chips">${COMPS.map(([k,l])=>`<button class="chip ${comps.includes(k)?'on':''}" data-act="qe-comp" data-v="${k}">${esc(l)}</button>`).join('')}</div>
    <button class="link" data-act="qe-del" style="color:var(--danger)">Delete question</button></div><div class="sh-foot"><button class="btn primary" style="width:100%" data-act="qe-save">Save</button></div>`,
    mount:()=>{A['qe-comp']=b=>{const v=b.dataset.v;comps=comps.includes(v)?comps.filter(x=>x!==v):[...comps,v];b.classList.toggle('on');};
      A['qe-lang']=b=>{lang=pickChip(b);};
      A['qe-save']=()=>{q.text=$('#qe-t').value.trim();if(!q.text)return toast('Enter the question.');q.comps=comps;q.lang=lang;putRec('questions',q);backView();};
      A['qe-del']=()=>{delRec('questions',q.id,'Question deleted');backView();};}};
}
APP.main=tab=>tab==='stories'?storiesHtml():tab==='iv'?ivHtml():tab==='gaps'?gapsHtml():practiceHtml();
APP.mount=tab=>{
  const sq=$('#sq');if(sq)sq.addEventListener('input',()=>{VIEW.sq=sq.value;clearTimeout(window._sqt);window._sqt=setTimeout(()=>{const y=sq.selectionStart;render();const n=$('#sq');n.focus();try{n.setSelectionRange(y,y);}catch(e){}},150);});
  const oq=$('#oq');if(oq)oq.addEventListener('keydown',e=>{if(e.key==='Enter'&&oq.value.trim()){const t=oq.value.trim();putRec('questions',{id:uid(),text:t,lang:/\b(Sie|Ihre?|warum|erzählen|beschreiben)\b/.test(t)?'de':'en',comps:[]});render();$('#oq').focus();}});
};

/* ---------- actions ---------- */
Object.assign(A,{
  'new-story':()=>editStory(null),'edit-story':b=>editStory(b.dataset.id),'open-story':b=>pushView(storyView(b.dataset.id)),
  'sd-kind':b=>{readSD();SD.kind=b.dataset.v;refreshView();},
  'sd-comp':b=>{const v=b.dataset.v;SD.comps=SD.comps.includes(v)?SD.comps.filter(x=>x!==v):[...SD.comps,v];b.classList.toggle('on');},
  'sd-lang':b=>{SD.lang=pickChip(b);},'sd-save':()=>saveStory(),
  'del-story':()=>{if(!confirm('Delete this story?'))return;delRec('stories',SD.id,'Story deleted');SD=null;closeSheet();},
  review:b=>{let l;if(b.dataset.iv){const iv=getRec('interviews',b.dataset.iv);l=(iv.stories||[]).map(id=>getRec('stories',id)).filter(s=>s&&!s.deleted);if(!l.length)l=stories();}
    else l=b.dataset.all?stories().slice().sort(()=>Math.random()-.5):dueStories();startReview(l);},
  'review-one':b=>{STACK=[];startReview([getRec('stories',b.dataset.id)]);},
  'rv-show':()=>{RV.shown=true;refreshView();},'rv-grade':b=>gradeReview(+b.dataset.g),
  'rv-newq':()=>{RV.q=pickQuestion(getRec('stories',RV.list[RV.i]),S.settings.lang);refreshView();},
  drill:()=>{if(!stories().length)return toast('Write a story first.');drillNew();pushView(drillView());},
  'drill-q':b=>{const q=allQuestions().find(x=>x.id===b.dataset.id);if(!q)return;DR={q,L:S.settings.lang==='de'?'de':'en'};pushView(drillView());},
  'drill-next':()=>{drillNew();refreshView();},
  'dr-lang':()=>{DR.L=DR.L==='de'?'en':'de';refreshView();},
  'dr-pick':b=>pushView(timerView(b.dataset.id,qText(DR.q,DR.L))),
  timer:b=>{const q=b.dataset.q&&RV?RV.q:'';pushView(timerView(b.dataset.id||null,q));},
  'tm-go':()=>tmGo(),
  'tm-reset':()=>{const t=TM;clearInterval(t.h);t.run=false;t.acc=0;t.phase=-1;t.buzzed=false;$('#tmgo').innerHTML=I.play+'Start';tmPaint();},
  'tm-len':b=>{S.settings.secs=+pickChip(b);save();TM.total=S.settings.secs;tmPaint();},
  'tm-rec':b=>{if(TM.run)return toast('Pause first to change recording.');TM.recOn=!TM.recOn;b.classList.toggle('on',TM.recOn);},
  'tm-notes':()=>{S.settings.hideNotes=!S.settings.hideNotes;save();const wasRun=TM.run;refreshView();if(wasRun)$('#tmgo').innerHTML=I.pause+'Pause';else if(tmElapsed()>0)$('#tmgo').innerHTML=I.play+'Resume';if(TM.audio&&!TM.run)tmShowAudio();},
  'tm-save':()=>{if(TM&&TM.blob)shareFile(`answer-${stamp()}.${/webm/.test(TM.blob.type)?'webm':'m4a'}`,TM.blob,TM.blob.type);},
  'set-lang':b=>{S.settings.lang=b.dataset.v;save();render();},
  'story-comp':b=>{S.settings.storyComp=b.dataset.v;save();render();},
  'new-iv':()=>editIv(null),'open-iv':b=>editIv(b.dataset.id),'iv-save':()=>saveIv(),
  'iv-plan':b=>{readIV();const v=b.dataset.v;IVD.stories=IVD.stories.includes(v)?IVD.stories.filter(x=>x!==v):[...IVD.stories,v];b.classList.toggle('on');},
  'iv-used':b=>{readIV();const v=b.dataset.v;IVD.used=IVD.used.includes(v)?IVD.used.filter(x=>x!==v):[...IVD.used,v];b.classList.toggle('on');},
  'iv-out':b=>{IVD.outcome=pickChip(b);},
  'iv-qs':()=>ivQuestionsToBank(),
  'iv-ics':()=>{readIV();const d=IVD;if(!isDay(d.day))return;const [hh,mm]=(d.time||'').split(':').map(Number);
    shareFile(`interview-${d.company.replace(/\W+/g,'-')}.ics`,icsBuild([{uid:d.id,day:d.day,start:isNaN(hh)?null:hh*60+(mm||0),dur:+d.dur||60,title:`Interview: ${d.company}${d.stage?' ('+d.stage+')':''}`,desc:[d.role,d.with,d.format].filter(Boolean).join('\n'),alarms:isNaN(hh)?[1]:[60,15]}]),'text/calendar');},
  'del-iv':()=>{if(!confirm('Delete this interview?'))return;delRec('interviews',IVD.id,'Interview deleted');IVD=null;closeSheet();},
  gseg:b=>{VIEW.gseg=b.dataset.v;render();},
  'gap-comp':b=>{const v=b.dataset.v;if(by(v)){S.settings.storyComp=v;save();VIEW.tab='stories';scrollMain(0);render();}else{editStory(null);SD.comps=[v];refreshView();}},
  'edit-q':b=>pushView(qEditView(b.dataset.id)),
  noop:()=>{},
});
function by(v){return stories().some(s=>(s.comps||[]).includes(v))?v:'';}
coreStart();

</script>
</body>
